[pytest]
# Collect only the real suites under tests/.
#
# eRadar360_CAD_Design/simulation/factory_test/eradar360_factory_test.py matches
# pytest's `test_*.py` pattern but is a hardware factory-test CLI: its
# `test_*(demo: bool)` functions take a mode flag, not fixtures, so pytest
# collected 11 of them and failed each with "fixture 'demo' not found".
# Run it directly instead:
#   python eRadar360_CAD_Design/simulation/factory_test/eradar360_factory_test.py --demo
testpaths = tests
