name: Dev-board CAD database

# Issue #28. Two jobs with deliberately different contracts:
#
#   validate     offline, blocking. Nothing about it depends on a vendor being reachable,
#                so it can gate every pull request without ever going red for a reason
#                the author cannot fix.
#   revalidate   networked, scheduled, non-blocking. A CAD database decays: URLs move,
#                vendors reorganise, revisions supersede. This job re-fetches what the
#                records claim and reports drift instead of letting the database quietly
#                become wrong between merges.

on:
  pull_request:
    branches: [master]
    paths:
      - "schemas/devboard-cad/**"
      - "tools/devboard_cad/**"
      - "tests/unit/test_devboard_*.py"
      - "boards/cad/**"
      - ".github/workflows/devboard-cad.yml"
  push:
    branches: [master]
    paths:
      - "schemas/devboard-cad/**"
      - "tools/devboard_cad/**"
      - "boards/cad/**"
  schedule:
    # Weekly drift check. Records age against the vendors, not against this repository.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate records (offline)
    runs-on: ubuntu-22.04
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt
          python -m pip install pytest

      - name: Validate every record against the schema
        run: python tools/devboard_cad/validate_records.py

      - name: Check the design-file mirror is complete, intact and licensed
        run: python tools/devboard_cad/mirror.py check

      - name: Run the dev-board test suites
        run: python -m pytest tests/unit/test_devboard_database.py tests/unit/test_devboard_verify.py tests/unit/test_devboard_mirror.py -v

  revalidate:
    name: Re-check claimed URLs against the vendors
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Advisory: a vendor outage or a new bot challenge is not a defect in this repository.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # validate_records.py imports jsonschema: the install step is required
      # here too — the 2026-10-26 scheduled run failed without it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/requirements.txt

      - name: Re-fetch every claimed file and compare digests
        run: python tools/devboard_cad/validate_records.py --revalidate --min-interval 2

      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devboard-cad-drift
          path: devboard-cad-drift.json
          if-no-files-found: ignore
